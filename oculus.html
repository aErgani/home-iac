<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCULUS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: black;
      color: #e0e0e0;
      overflow: hidden;
    }

    /* Container stays visible instantly so sparks/glows can render immediately */
    .background-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Background image fades/zooms independently */
    .background-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; 
      display: block;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      animation: sceneFadeInZoom 10s ease-out forwards;
    }

    /* --- THE MECHANICUS EFFECTS --- */
    
    /* Main Cyan Eye Flicker (Your Custom Coordinates Preserved) */
    .eye-glow-blue {
      position: absolute;
      top: 46.5%; 
      left: 43.3%;
      width: 2.5vw;
      height: 2.5vw;
      max-width: 40px;
      max-height: 40px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(0,235,255,1) 0%, rgba(0,150,255,0.6) 40%, rgba(0,100,255,0) 70%);
      border-radius: 50%;
      z-index: 1;
      mix-blend-mode: screen;
      animation: eyeFlicker 1.2s infinite alternate;
      pointer-events: none;
    }

    /* Cybernetic Red Lens Glow (Your Custom Coordinates Preserved) */
    .eye-glow-red {
      position: absolute;
      top: 58.2%; 
      left: 66.3%;
      width: 1.8vw;
      height: 1.8vw;
      max-width: 22px;
      max-height: 22px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,50,50,1) 0%, rgba(255,0,0,0.7) 40%, rgba(255,0,0,0) 70%);
      border-radius: 50%;
      z-index: 1;
      mix-blend-mode: screen;
      animation: eyeFlicker 0.8s infinite alternate-reverse;
      pointer-events: none;
    }

    /* Sparks container */
    .spark-container {
      position: absolute;
      top: 60%;
      left: 71%;
      width: 100px;
      height: 100px;
      z-index: 2;
      pointer-events: none;
    }

    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      background-color: #ffaa44;
      box-shadow: 0 0 8px #ff4500;
      border-radius: 50%;
      opacity: 0;
    }

    /* Distributed timing logic for all 9 sparks to keep density constant */
    .spark:nth-child(1) { animation: sparkBurst1 3.5s infinite 0.1s; }
    .spark:nth-child(2) { animation: sparkBurst2 3.5s infinite 0.5s; }
    .spark:nth-child(3) { animation: sparkBurst3 3.5s infinite 0.9s; }
    .spark:nth-child(4) { animation: sparkBurst1 3.5s infinite 1.3s; }
    .spark:nth-child(5) { animation: sparkBurst2 3.5s infinite 1.7s; }
    .spark:nth-child(6) { animation: sparkBurst3 3.5s infinite 2.1s; }
    .spark:nth-child(7) { animation: sparkBurst1 3.5s infinite 2.5s; }
    .spark:nth-child(8) { animation: sparkBurst2 3.5s infinite 2.9s; }
    .spark:nth-child(9) { animation: sparkBurst3 3.5s infinite 3.3s; }

    /* --- ANIMATIONS --- */

    @keyframes sceneFadeInZoom {
      0% {
        opacity: 0;
        transform: scale(1);
      }
      100% {
        opacity: 0.95;
        transform: scale(1.04);
      }
    }

    @keyframes eyeFlicker {
      0%, 100% { opacity: 0.2; transform: translate(-50%, -50%) scale(0.8); }
      5% { opacity: 0.9; }
      10% { opacity: 0.4; }
      12% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      14% { opacity: 0.1; }
      20% { opacity: 0.8; }
      22% { opacity: 0.3; }
      60% { opacity: 0.9; }
      64% { opacity: 0.4; }
      70% { opacity: 1; }
      78% { opacity: 0.2; }
    }

    @keyframes sparkBurst1 {
      0% { opacity: 0; transform: translate(0, 0) scale(1); }
      1% { opacity: 1; }
      15% { opacity: 1; transform: translate(-30px, -15px) scale(0.5); }
      20% { opacity: 0; transform: translate(-45px, -10px) scale(0); }
      100% { opacity: 0; }
    }

    @keyframes sparkBurst2 {
      0% { opacity: 0; transform: translate(5px, -5px) scale(1); }
      2% { opacity: 1; }
      10% { opacity: 1; transform: translate(25px, -30px) scale(0.6); }
      15% { opacity: 0; transform: translate(35px, -45px) scale(0); }
      100% { opacity: 0; }
    }

    @keyframes sparkBurst3 {
      0% { opacity: 0; transform: translate(-5px, 5px) scale(1); }
      1% { opacity: 1; }
      12% { opacity: 1; transform: translate(-10px, 35px) scale(0.4); }
      18% { opacity: 0; transform: translate(-15px, 50px) scale(0); }
      100% { opacity: 0; }
    }

    /* --- UI ELEMENTS --- */
    .overlay-ui {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 20px;
      box-sizing: border-box;
    }

    .header {
      width: 100%;
      background: rgba(51, 51, 51, 0.8);
      color: #ff4d4d;
      padding: 2px 0;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 4em;
      margin: 0;
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
    }

    .main-wrapper {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      padding: 0 20px;
    }

    .container {
      width: 400px;
      background: rgba(30, 30, 30, 0.9);
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
      margin-top: -10px;
    }

    h1 {
      color: #ff4d4d;
      margin-bottom: 20px;
      font-size: 2.5em;
      font-weight: 700;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin: 15px 0;
      padding: 15px;
      border-radius: 8px;
      background: #2a2a2a;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      transition: background 0.3s, transform 0.3s;
    }

    li:hover {
      background: #3a3a3a;
      transform: translateY(-5px);
    }

    a {
      text-decoration: none;
      color: #ff4d4d;
      font-weight: 600;
      transition: color 0.3s;
    }

    a:hover {
      color: #ff6666;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .header h1 { font-size: 2em; }
      .container { width: 90%; padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="background-container">
    
    <img class="background-image" src="https://i.kym-cdn.com/entries/icons/original/000/042/944/Warhammer_40_000__Mechanicus___Teaser_Trailer_0-49_screenshot.png" alt="Background" />
    
    <div class="eye-glow-blue"></div>
    <div class="eye-glow-red"></div>

    <div class="spark-container">
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
    </div>

    <div class="overlay-ui">
      <div class="header">
        <h1>OCULUS</h1>
      </div>
      <div class="main-wrapper">
        <div class="container">
          <h1>Paths</h1>
          <ul>
            <li><a href="http://oculus/grafana" target="_blank" rel="noopener noreferrer">Grafana</a></li>
            <li><a href="http://homeassistant.oculus" target="_blank" rel="noopener noreferrer">Home Assistant</a></li>
            <li><a href="http://oculus/jackett" target="_blank" rel="noopener noreferrer">Jackett</a></li>
            <li><a href="http://oculus/jellyfin" target="_blank" rel="noopener noreferrer">Jellyfin</a></li>
            <li><a href="http://oculus/qbittorrent" target="_blank" rel="noopener noreferrer">QBittorrent</a></li>
            <li><a href="http://oculus/sonarr" target="_blank" rel="noopener noreferrer">Sonarr</a></li>
            <li><a href="http://oculus/radarr" target="_blank" rel="noopener noreferrer">Radarr</a></li>
            <li><a href="http://oculus/bazarr" target="_blank" rel="noopener noreferrer">Bazarr</a></li>
          </ul>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
